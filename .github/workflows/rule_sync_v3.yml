# version: v3_beta
# updated at: 2026-09-01
#
#
# UTC 22:00 (北京时间早 6:00 自动拉取) 
#
# 支持:
#   - surge
#   - mihomo
#

name: 自动化规则下载 v3_beta

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "add_rules/*"

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Shanghai

jobs:
  rule_sync:
    runs-on: ubuntu-latest
    env:
      # 数据源: MetaCubeX/meta-rules-dat
      GEOIP_DAT_URL: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
      GEOSITE_LIST: "private,google,telegram,cn,geolocation-!cn,custom-direct,custom-proxy,custom-reject"
      GEOIP_LIST: "private,google,telegram,cn"
    
    steps:
      - name: "当前仓库 rules 分支"
        uses: actions/checkout@v7
        with:
          path: rules
          ref: rules
          fetch-depth: 1

      - name: "检出当前仓库 main 分支"
        uses: actions/checkout@v7
        with:
          path: main
          ref: main
          fetch-depth: 1

      - name: "检出 DLC 仓库"
        uses: actions/checkout@v7
        with:
          repository: v2fly/domain-list-community
          path: dlc
          fetch-depth: 1

      - name: "设置 Go 环境"
        uses: actions/setup-go@v7
        with:
          go-version-file: dlc/go.mod
          cache-dependency-path: dlc/go.sum
      
      - name: "添加自定义规则"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dlc/data/_custom

          for file in main/add_rules/*; do
            [ -f "$file" ] || continue
            cp "$file" "dlc/data/_custom/$(basename "$file")"
          done

      - name: "编译 geosite.dat"
        working-directory: dlc
        run: |
          go run . \
            --datapath=./data \
            --outputdir=.. \
            --outputname=geosite.dat

      - name: "下载 geoip.dat"
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            -o geoip.dat \
            "$GEOIP_DAT_URL"

      - name: 清理旧规则
        run: |
          rm -rf rules/geo
          rm -rf rules/surge

      - name: 生成 GEO 数据
        run: |
          mkdir -p rules/geo
          cp geoip.dat rules/geo/
          cp geosite.dat rules/geo/


      - name: 生成 Surge 规则
        shell: bash
        run: |
          set -euo pipefail

          converter="main/tools/geox-linux-amd64"
          geosite_dir="$RUNNER_TEMP/surge-geosite"
          geoip_dir="$RUNNER_TEMP/surge-geoip"

          chmod +x main/tools/geox-linux-amd64
          mkdir -p "$geosite_dir" "$geoip_dir" rules/surge

          "$converter" geosite \
            -f geosite.dat \
            -t surge \
            -o "$geosite_dir"

          "$converter" geoip \
            -f geoip.dat \
            -t surge \
            -o "$geoip_dir"

          declare -A selected_geosite=()
          declare -A selected_geoip=()

          IFS=',' read -r -a geosite_names <<< "$GEOSITE_LIST"
          IFS=',' read -r -a geoip_names <<< "$GEOIP_LIST"

          for name in "${geosite_names[@]}"; do
            selected_geosite["$name"]=1
          done

          for name in "${geoip_names[@]}"; do
            selected_geoip["$name"]=1
            if [ ! -f "$geoip_dir/$name.list" ]; then
              echo "::error::缺少 geoip 规则: $name"
              exit 1
            fi
          done

          shopt -s nullglob
          for name in "${geosite_names[@]}"; do
            domain_file="$geosite_dir/$name.list"
            ip_file="$geoip_dir/$name.list"

            if [ ! -f "$domain_file" ]; then
              echo "::error::缺少 geosite 规则: $name"
              exit 1
            fi

            # 保留所选 geosite 的属性变体，例如 google@cn。
            for source_file in "$domain_file" "$geosite_dir/$name@"*.list; do
              stem=$(basename "$source_file" .list)
              output_file="rules/surge/$stem.txt"

              # 同名 geosite 与 geoip 合并为一个 Surge RULE-SET。
              if [ "$stem" = "$name" ] && [[ -n "${selected_geoip[$name]:-}" ]]; then
                awk '!seen[$0]++' "$source_file" "$ip_file" > "$output_file"
              else
                cp "$source_file" "$output_file"
              fi
            done
          done

          # GEOIP_LIST 允许包含没有对应 geosite 的独立条目。
          for name in "${geoip_names[@]}"; do
            if [[ -z "${selected_geosite[$name]:-}" ]]; then
              cp "$geoip_dir/$name.list" "rules/surge/$name.txt"
            fi
          done
      
      - name: 提交变更
        working-directory: rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan temp
          git branch -D rules
          git checkout --orphan rules
          
          git add .
          git commit -m "CI: Last Update at $(date +"%Y-%m-%d %H:%M")"
          git push -f origin rules

  clean_workflow:
    runs-on: ubuntu-latest
    needs: rule_sync
    steps:
      - name: clean_workflow
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 0
          repository: ${{ github.repository }}
